<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Design</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
        
        .heading-font {
            font-family: 'SF Pro Rounded', 'Quicksand', 'Roboto', sans-serif;
        }
        
        .art-img {
            height: 200px;
            object-fit: cover;
        }
        
        @media (min-width: 992px) {
            .art-img {
                height: 100%;
            }
        }
    </style>
</head>

<body>
    <section class="py-4 min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center g-4 my-auto">

                <div class="col-12 col-lg-6 order-2 order-lg-1">
                    <div class="mx-auto" style="max-width: 420px;">
                        <h2 class="fw-bold heading-font">Welcome Back 👋</h2>
                        <p class="text-secondary small mb-1 heading-font">Today is a new day. It's your day. You shape it.</p>
                        <p class="text-secondary small mb-4 heading-font">Sign in to start managing your projects.</p>

                        <form action="">
                            <div class="mb-3">
                                <label for="email" class="form-label text-dark small fw-medium">Email</label>
                                <input type="email" id="email" class="form-control rounded-3 border-0 py-2 px-3" placeholder="Example@email.com" style="background-color: #f4f7fa;">
                            </div>

                            <div class="mb-2">
                                <label for="password" class="form-label text-dark small fw-medium">Password</label>
                                <input type="password" id="password" class="form-control rounded-3 border-0 py-2 px-3" placeholder="At least 8 characters" style="background-color: #f4f7fa;">
                            </div>

                            <div class="text-end mb-4">
                                <a href="#" class="text-decoration-none small text-primary fw-medium">Forgot Password?</a>
                            </div>

                            <button class="btn btn-dark w-100 rounded-3 py-2 fw-medium border-0" style="background-color: #1c2b36;">Sign in</button>
                        </form>

                        <div class="d-flex align-items-center my-4">
                            <hr class="flex-grow-1 my-0 text-muted">
                            <span class="px-3 text-secondary small">
                                <span class="d-lg-none">Or sign in with</span>
                            <span class="d-none d-lg-inline">Or</span>
                            </span>
                            <hr class="flex-grow-1 my-0 text-muted">
                        </div>

                        <div class="d-grid gap-2">
                            <div class="row g-2">
                                <div class="col-6 col-lg-12">
                                    <button class="btn btn-light rounded-3 w-100 py-2 d-flex align-items-center justify-content-center gap-2 border-0 fw-medium text-dark" style="background-color: #f3f5f7;">
                                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width: 18px; height: 18px;">
                                        <span class="small">
                                            <span class="d-none d-lg-inline">Sign in with </span>Google
                                        </span>
                                    </button>
                                </div>
                                <div class="col-6 col-lg-12">
                                    <button class="btn btn-light rounded-3 w-100 py-2 d-flex align-items-center justify-content-center gap-2 border-0 fw-medium text-dark" style="background-color: #f3f5f7;">
                                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="Facebook" style="width: 22px; height: 22px;">
                                        <span class="small">
                                            <span class="d-none d-lg-inline">Sign in with </span>Facebook
                                        </span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <span class="small text-secondary">Don't you have an account? </span>
                            <a href="#" class="text-decoration-none text-primary fw-medium small">Sign up</a>
                        </div>

                        <footer class="mt-4 text-center">
                            <p class="text-secondary small mb-0" style="font-size: 0.75rem; letter-spacing: 0.5px;">
                                © 2023 ALL RIGHTS RESERVED
                            </p>
                        </footer>
                    </div>
                </div>

                <div class="col-12 col-lg-6 order-1 order-lg-2">
                    <div class="h-100">
                        <img src="img/Art.png" alt="Art" class="w-100 art-img rounded-4">
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>

</html>
